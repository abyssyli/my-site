<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V18 — Typography Refinement</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      .wrap { width: min(980px, 100%); margin: 0 auto; padding: 22px 18px 40px; display: grid; gap: 14px; }
      .card { border: 1px solid rgba(15,23,42,0.12); border-radius: 14px; background: #ffffff; padding: 16px; }
      .title { margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(15,23,42,0.7); }
      .muted { margin: 12px 0 0; color: rgba(15,23,42,0.62); line-height: 1.7; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main class="wrap" aria-label="V18 direction">
      <section class="card" aria-label="Summary">
        <p class="title">V18</p>
        <h1 style="margin: 10px 0 0; letter-spacing: -0.02em">Typography and Featured Hero</h1>
        <p class="muted">
          Refines the V17 layout with stronger typographic hierarchy, a featured hero card, and subtle dividers.
          Implemented and polished in <a href="./index.html">V25</a>.
        </p>
      </section>
    </main>
  </body>
</html>
