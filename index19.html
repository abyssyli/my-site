<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V19 — Author Brand Refinement</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      .wrap { width: min(980px, 100%); margin: 0 auto; padding: 22px 18px 40px; display: grid; gap: 14px; }
      .card { border: 1px solid rgba(15,23,42,0.12); border-radius: 14px; background: #ffffff; padding: 16px; }
      .title { margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(15,23,42,0.7); }
      .muted { margin: 12px 0 0; color: rgba(15,23,42,0.62); line-height: 1.7; }
      .dot { width: 10px; height: 10px; border-radius: 999px; background: rgba(99,102,241,0.7); display: inline-block; margin-right: 10px; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main class="wrap" aria-label="V19 direction">
      <section class="card" aria-label="Summary">
        <p class="title">V19</p>
        <h1 style="margin: 10px 0 0; letter-spacing: -0.02em"><span class="dot" aria-hidden="true"></span>Identity Polish</h1>
        <p class="muted">
          Tightens the author section: avatar ring, name sizing, role text, a stats row, and a pinned label for the first
          post. Reflected in <a href="./index.html">V25</a>.
        </p>
      </section>
    </main>
  </body>
</html>
