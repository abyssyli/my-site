<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V17 — Core Direction (Dark Sidebar + Light Content)</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      .wrap { width: min(980px, 100%); margin: 0 auto; padding: 22px 18px 40px; display: grid; gap: 14px; }
      .card { border: 1px solid rgba(15,23,42,0.12); border-radius: 14px; background: #ffffff; padding: 16px; }
      .title { margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(15,23,42,0.7); }
      .muted { margin: 12px 0 0; color: rgba(15,23,42,0.62); line-height: 1.7; }
      .btn { display: inline-block; margin-top: 12px; text-decoration: none; border: 1px solid rgba(99,102,241,0.28); background: rgba(99,102,241,0.1); border-radius: 999px; padding: 10px 12px 9px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(15,23,42,0.82); }
    </style>
  </head>
  <body>
    <main class="wrap" aria-label="V17 direction">
      <section class="card" aria-label="Summary">
        <p class="title">V17</p>
        <h1 style="margin: 10px 0 0; letter-spacing: -0.02em">Dark Sidebar · Light Main</h1>
        <p class="muted">
          Core direction: fixed left sidebar for identity + light main area for readability. This direction is carried
          forward into the final multi-page version.
        </p>
        <a class="btn" href="./index.html">Open V25 (index.html)</a>
      </section>
    </main>
  </body>
</html>
