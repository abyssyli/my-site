<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V14 — Fixed Left Sidebar Blog</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      .shell { min-height: 100%; display: grid; grid-template-columns: 260px 1fr; }
      .side { position: sticky; top: 0; height: 100vh; background: #2d3748; color: rgba(255,255,255,0.9); padding: 18px; display: grid; gap: 14px; }
      .avatar { width: 120px; height: 120px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08); }
      .nav a { display: block; color: rgba(255,255,255,0.78); text-decoration: none; padding: 10px 10px; border-radius: 10px; }
      .nav a:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.92); }
      .main { padding: 22px; display: grid; gap: 14px; }
      .card { background: #ffffff; border: 1px solid rgba(15,23,42,0.12); border-radius: 14px; padding: 16px; }
      .muted { color: rgba(15,23,42,0.62); line-height: 1.7; }
      @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .side { height: auto; position: relative; } }
    </style>
  </head>
  <body>
    <div class="shell" aria-label="Fixed sidebar layout">
      <aside class="side" aria-label="Fixed sidebar">
        <div class="avatar" aria-hidden="true"></div>
        <div style="font-weight: 800; letter-spacing: 0.02em">Avery Blog</div>
        <div style="color: rgba(255,255,255,0.68); line-height: 1.6">Fixed left sidebar, scrollable main feed.</div>
        <nav class="nav" aria-label="Nav">
          <a href="#">Home</a>
          <a href="#">Blog</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </nav>
      </aside>
      <main class="main" aria-label="Main content">
        <section class="card" aria-label="Description">
          <div style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(15,23,42,0.62)">V14</div>
          <h1 style="margin: 10px 0 0; letter-spacing: -0.02em">Fixed Sidebar Direction</h1>
          <p class="muted" style="margin: 10px 0 0">
            This version focuses on a permanently visible left navigation. For the final polished multi-page build, open:
            <a href="./index.html">index.html</a>.
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
